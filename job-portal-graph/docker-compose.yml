# Bolt port open = ready enough for a dev instance. A JVM-based probe times out
# under this machine's emulated colima VM.
x-neo4j-healthcheck: &neo4j-healthcheck
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687' || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 180s

# Pinned to 5.20: the neo4j:5 JDK 21 image segfaults (SIGSEGV in C1) in this
# machine's x86_64 colima VM; 5.20 ships JDK 17, which runs there.
services:
  neo4j:
    image: neo4j:5.20
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
    volumes: ["neo4j_data:/data"]
    healthcheck: *neo4j-healthcheck
  neo4j-test:
    image: neo4j:5.20
    profiles: ["test"]
    ports: ["7688:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_TEST_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
    healthcheck: *neo4j-healthcheck
volumes:
  neo4j_data: {}
